name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test client
        run: npm run test:client

      - name: Test React
        run: |
          npm run test:react

      - name: Test Backend
        run: npm run test:server

      - name: Install Playwright browser
        run: npm run -w @device-portal/e2e install-browsers -- --with-deps

      - name: Test end-to-end
        run: npm run test:e2e

      - name: Upload e2e traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: e2e/test-results
